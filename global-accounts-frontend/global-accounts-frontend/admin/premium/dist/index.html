F"],desc:"Where supported — not available for NGN."},{id:"payment_gateway",label:"Payment gateway",icon:"globe",feePct:1,feeNote:"1.0% gateway fee",currencies:null,desc:"Simulated third-party checkout."},{id:"bank_transfer",label:"Bank transfer",icon:"bank",feePct:0,feeNote:"No fee",currencies:null,desc:"Simulated transfer — settles as PENDING until confirmed."}];GL.DEPOSIT_LIMITS={NGN:[1e3,5e6],USD:[10,5e4],GBP:[10,4e4],EUR:[10,45e3],CHF:[10,45e3]};GL.WHAT_IS_OFFSHORE={intro:"An international (often called “offshore”) account is simply an account held outside your country of residence, usually in a different currency. People use them to receive salaries abroad, hold savings in stable currencies, pay international tuition or suppliers, and keep money in the currency they actually spend.",sections:[{icon:"globe",title:"What it is",text:"A multi-currency account that sits alongside your local bank accounts. You keep balances in several currencies and transact in each of them separately."},{icon:"landmark",title:"What it is not",text:"It is not a replacement for your bank, and it is not a way to hide money. International accounts are ordinary, transparent financial tools used by millions of people."},{icon:"coins",title:"Who uses them",text:"Freelancers paid in USD or EUR, families funding education abroad, cross-border commuters, small importers and exporters, and savers who want currency diversification."},{icon:"shield-check",title:"How they are regulated",text:"In production, customer funds in platforms like this are held with regulated partner institutions and are subject to know-your-customer and anti-money-laundering checks in every market served."}],misconceptions:[{q:"“Offshore means hidden.”",a:"No. Modern international accounts are fully documented and reported. Transparency is a legal requirement, not an option."},{q:"“They are only for the very wealthy.”",a:"No. Digital multi-currency accounts serve ordinary cross-border earners and savers, often with no minimum balance."},{q:"“It replaces my bank.”",a:"No. It complements your bank — a second, currency-flexible account alongside your existing relationships."}]};GL.HOW_STEPS=[{n:1,icon:"user",title:"Create your account",text:"Register with your name, email, country and international phone number, and choose a password."},{n:2,icon:"mail",title:"Verify email and phone",text:"Enter the one-time codes sent to your email and phone. In this prototype the codes are simulated and shown on screen — nothing real is sent."},{n:3,icon:"coins",title:"Your default currency activates",text:"Based on your country — Nigeria gets NGN, the United States USD, the United Kingdom GBP, Switzerland CHF, eurozone countries EUR. It starts at a zero balance."},{n:4,icon:"plus",title:"Add currencies and simulate deposits",text:"Activate any of the five supported currencies. Each keeps its own balance, transaction history, deposit records and status — nothing is converted automatically."},{n:5,icon:"chart",title:"Manage everything in one place",text:"Track transactions, preview and download statements, manage security, sessions and notifications, and reach support."}];GL.FEATURES=[{icon:"coins",title:"Multi-currency accounts",text:"Hold NGN, USD, GBP, EUR and CHF side by side. Every currency account has its own balance, history and status."},{icon:"globe",title:"Country-based activation",text:"The currency for your country is activated automatically after verification. The mapping is configurable."},{icon:"plus",title:"Flexible currency activation",text:"Activate additional currencies yourself in seconds. New accounts always start at zero — balances are never auto-converted."},{icon:"card",title:"Simulated deposits",text:"Debit card, credit card where supported, payment gateway and bank transfer — with success, pending, failed, cancelled and duplicate states."},{icon:"search",title:"Transparent history",text:"Search and filter every transaction by text, currency, status and date, and open a full detail view for any record."},{icon:"doc",title:"Monthly statements",text:"Per-currency statements with opening and closing balances, line previews and a simulated download."},{icon:"bell",title:"Notifications and support",text:"In-app notifications for account events and a support desk with tracked conversations."},{icon:"shield",title:"Security controls",text:"MFA settings, login history, active sessions with device details, suspicious-activity alerts and a temporary account freeze."}];GL.FAQ=[{q:"Is this a bank account?",a:"No. Meridian provides a platform account — a company-issued multi-currency account you manage through our interface. It is not a bank account and this prototype does not provide actual offshore bank accounts or regulated banking services. In production, funds are held with regulated partner institutions."},{q:"Which currencies are supported?",a:"The platform initially supports five currencies: Nigerian Naira (NGN), US Dollar (USD), British Pound (GBP), Euro (EUR) and Swiss Franc (CHF). Additional currencies appear as they become available — unavailable ones are shown with a note."},{q:"How does my default currency get chosen?",a:"From the country you select at registration: Nigeria → NGN, United States → USD, United Kingdom → GBP, Switzerland → CHF, eurozone countries → EUR, others default to USD. The mapping is configurable."},{q:"Can I convert money between currencies?",a:"No. Each activated currency keeps its own separate balance, history and deposit records. Activating a new currency never converts or moves funds from another currency — new accounts always start at zero."},{q:"How do deposits work in this prototype?",a:"Deposits are fully simulated. You choose a currency, amount and method, review the details, then submit through a mock payment gateway. The simulator can return successful, pending, failed, cancelled or duplicate outcomes. No real money moves and no real payment provider is contacted."},{q:"What happens if a deposit is pending or fails?",a:"Pending deposits are awaiting confirmation and do not credit your balance. Failed and cancelled deposits never credit your balance. Only successful simulated payments update the balance of the specific currency you deposited into."},{q:"Who can see or change my account?",a:"Administrators can view accounts through a fully audited takeover mode with a permanent on-screen indicator, and can edit permitted profile information and manage currency activation. They cannot withdraw, transfer, edit balances, alter deposit confirmations or modify historical ledger entries — the restriction is enforced in the service layer, not just hidden buttons."},{q:"Will I be notified when an administrator views my account?",a:"Takeover sessions are not notified automatically. Administrators can send a manual notification from the account viewer when appropriate."},{q:"What security features are demonstrated?",a:"Email and phone verification, MFA settings, login history, active sessions with device details, suspicious-login alerts, a temporary account freeze with reason, account recovery, and a security event history."},{q:"Is any of this real?",a:"No. This is a frontend design prototype for client review. Every user, balance, transaction, statement and notification is demonstration data stored in your browser. Use “Reset demo data” in the demo controls to restore the original state."}];GL.TERMS_SECTIONS=[{title:"Demonstration notice",text:"This document is part of a frontend design prototype. It outlines the intended production terms for review purposes and is not a legally binding agreement."},{title:"Platform account, not a bank account",text:"Meridian provides company-issued platform accounts for holding and managing supported currencies. These are not bank accounts. The platform does not provide actual offshore bank accounts or regulated banking services."},{title:"Eligibility",text:"You must be at least 18 years old, provide accurate identity and contact information, and complete email and phone verification. Additional identity verification applies in production under local know-your-customer rules."},{title:"Currency activation and balances",text:"Your country determines the default currency activated after verification. You may activate additional supported currencies. Each currency account is separate: balances, history and deposits are held per currency and are never converted automatically."},{title:"Deposits",text:"In this prototype all deposits are simulated. In production, deposits are accepted through licensed payment partners, are credited only after confirmation, and may be pending, failed, cancelled or rejected as duplicates depending on the payment provider response."},{title:"Administrative access",text:"Administrators may access customer accounts through an audited takeover mode limited to viewing and permitted edits. Administrators cannot withdraw funds, transfer funds, edit balances, change deposit confirmations or modify historical ledger entries. Users are not automatically notified of takeover sessions but may receive manual notifications."},{title:"Liability",text:"The prototype is provided “as is” for design evaluation, without warranty of any kind. Production terms on liability, indemnity and dispute resolution will be defined in the final agreement."},{title:"Changes",text:"These terms may be updated as the product and its regulatory posture evolve. Material changes will be communicated through the platform in production."}];GL.PRIVACY_SECTIONS=[{title:"Demonstration notice",text:"This policy is part of a frontend design prototype. In this demo, all data you enter is stored only in your own browser and never transmitted anywhere."},{title:"Data we would collect",text:"In production: identity and contact details you provide at registration, account and transaction records generated as you use the platform, device and security events used to protect your account, and support communications."},{title:"How data would be used",text:"To operate your multi-currency accounts, verify your identity, prevent fraud and money laundering, respond to support requests, and meet legal obligations in the markets served."},{title:"Storage in this prototype",text:"The demo stores its data in your browser’s local storage only. Clearing your browser data or using “Reset demo data” removes it completely. Nothing is sent to a server."},{title:"Security",text:"The production platform would protect data with encryption in transit and at rest, multi-factor authentication, session controls and a full audit trail of administrative access."},{title:"Your rights",text:"In production you would be able to access, correct, export and delete your personal data, subject to legal retention requirements, by contacting our privacy team."},{title:"Contact",text:"Questions about privacy can be directed to privacy@meridian.example (demo address for the prototype)."}];GL.PLATFORM_STATS=[{num:"5",lbl:"Supported currencies"},{num:"24",lbl:"Countries served (demo)"},{num:"48,213",lbl:"Account holders (demo figure)"},{num:"99.95%",lbl:"Platform uptime (demo figure)"}];GL.ADMIN_ROLES=[{id:"super-admin",name:"Super Administrator",members:["Nadia Farouk"],desc:"Full platform administration. Financial mutations remain blocked for every role by policy."},{id:"compliance",name:"Compliance Officer",members:["Marcus Lee"],desc:"Security monitoring, account freezes and audit review."},{id:"support",name:"Support Agent",members:["Priya Sharma"],desc:"Support tickets and read-only account access."},{id:"readonly",name:"Read-only Analyst",members:["Tomas Weber"],desc:"Reporting and dashboards only."}];GL.PERMISSION_MATRIX={columns:["Super Administrator","Compliance Officer","Support Agent","Read-only Analyst"],rows:[{area:"Customer accounts",v:["Full","View","View","View"]},{area:"Account takeover (view mode)",v:["Full","View","View","None"]},{area:"Permitted profile edits",v:["Edit","None","Edit","None"]},{area:"Curr
