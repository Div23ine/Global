name: Deploy API to Cloudflare Workers

on:
  push:
    branches: [main, development]
    paths:
      - 'backend/**'
      - '.github/workflows/workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Fetch and reset to latest development
        run: git fetch origin development && git checkout -B development FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --exclude tests/integration/**

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Worker name is defined as "global" in backend/wrangler.toml.
# Worker runtime secrets (Supabase, Resend, etc.) remain configured in Cloudflare
# and are not copied into GitHub Actions.
