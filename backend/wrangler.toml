# Meridian Global Accounts API — Cloudflare Workers
name = "global"
main = "src/worker.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_modules", "enable_nodejs_http_server_modules"]

[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"
PAYMENT_PROVIDER = "manual-bank-transfer"
RESEND_FROM_NAME = "Meridian Global Accounts"
RESEND_FROM_EMAIL = "bankdetails@info.meridian.uk.com"
CORS_ORIGIN = "https://meridian.uk.com,https://www.meridian.uk.com"

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "675001"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "DEPOSIT_RATE_LIMITER"
namespace_id = "675002"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "SUPPORT_RATE_LIMITER"
namespace_id = "675003"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "675004"
[ratelimits.simple]
limit = 10
period = 60

[observability]
enabled = true
