<!DOCTYPE html>
<html lang="en" data-concept="hongkong">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Meridian Global Accounts</title>
  <meta name="description" content="Contact the Meridian Global Accounts team.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="gl-header"></div>
  <main id="main">

    <section class="section">
      <div class="container narrow">
        <div class="sec-head"><h1>Contact us</h1></div>
        <p class="lead">Questions about accounts, currencies or deposits? Send us a message and the team will reply by email.</p>
        <form data-contact-form novalidate>
          <div class="field"><label for="cf-name">Your name</label><input class="input" id="cf-name" name="name" type="text" required maxlength="120"></div>
          <div class="field"><label for="cf-email">Email address</label><input class="input" id="cf-email" name="email" type="email" required maxlength="160"></div>
          <div class="field"><label for="cf-topic">Topic</label>
            <select class="input" id="cf-topic" name="topic">
              <option>General question</option><option>Accounts &amp; currencies</option>
              <option>Deposits</option><option>Security</option><option>Partnerships</option>
            </select>
          </div>
          <div class="field"><label for="cf-msg">Message</label><textarea class="input" id="cf-msg" name="message" rows="5" required maxlength="4000"></textarea></div>
          <button class="btn btn-primary btn-lg" type="submit">Send message</button>
        </form>
        <div data-form-success hidden class="callout" style="margin-top:16px">
          <b>Thank you.</b> Your message has been noted. For account-specific matters, please also open a support ticket from your dashboard so we can verify your identity.
        </div>
      </div>
    </section>
  </main>
  <div id="gl-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
