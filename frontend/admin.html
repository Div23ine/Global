<!DOCTYPE html>
<html lang="en" data-concept="hongkong">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Global Accounts — Administration</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Meridian administration console.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/admin.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    #boot-error { display:none; max-width:480px; margin:48px auto; padding:24px; font:14px/1.5 Inter,system-ui,sans-serif; border:1px solid #F5C2C0; background:#FEF3F2; border-radius:12px; color:#912018; }
    #boot-error.show { display:block; }
  </style>
</head>
<body data-page="admin">
  <div id="boot-error" role="alert"></div>
  <div id="gl-app" aria-live="polite">
    <div class="auth-viewport"><div class="auth-wrap"><div class="auth-card"><p class="muted">Loading administration…</p></div></div></div>
  </div>

  <script>
    window.__meridianBootError = function (err) {
      var el = document.getElementById('boot-error');
      if (!el) return;
      el.className = 'show';
      el.innerHTML = '<b>Could not start the admin console.</b><p style="margin:8px 0 0">' +
        String((err && err.message) || err || 'Unknown error') + '</p>';
      console.error(err);
    };
    window.addEventListener('error', function (e) {
      var root = document.getElementById('gl-app');
      var booted = root && root.querySelector && root.querySelector('.shell, .auth-card, .auth-viewport, .auth-wrap, .page-frame, .view-stack');
      if (booted) return; // runtime view errors must not replace the console with the boot panel
      if (e && e.message) window.__meridianBootError(e.error || e.message);
    });
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="js/config.js?v=20261123-admin-otp"></script>
  <script src="js/util.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/services/supabase-auth.js?v=20261123-admin-otp"></script>
  <script src="js/services/http.js"></script>
  <script src="js/services/api.js"></script>
  <script type="text/babel" data-presets="react" src="js/components/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/admin/views-core.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/admin/views-ops.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/admin/views-refunds.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/admin/main.jsx"></script>
</body>
</html>
