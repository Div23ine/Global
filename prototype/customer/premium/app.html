<!DOCTYPE html>
<html lang="en" data-concept="premium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Global Accounts — Customer Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
  <script>
    /* The premium theme is persisted under localStorage "gl_premium_theme"
       (default dark) and is normally applied by assets/components.js, which the
       app shell does not load. Apply it here, before first paint; views.js
       re-applies it on every frame render and owns the in-app toggle. */
    (function () {
      var t = 'dark';
      try { if (localStorage.getItem('gl_premium_theme') === 'light') t = 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body data-page="app">
  <a class="skip-link" href="#gl-main">Skip to content</a>
  <div id="gl-app" aria-live="polite"></div>
  <div id="gl-toasts" class="gl-toasts" aria-live="polite"></div>
  <div id="gl-modal" class="gl-modal-root" hidden></div>
  <script src="../../shared/icons.js"></script>
  <script src="../../shared/data.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/charts.js"></script>
  <script src="assets/views.js"></script>
  <script src="assets/views-more.js"></script>
  <script src="../../shared/app-core.js"></script>
  <script src="../../shared/demo-panel.js"></script>
</body>
</html>
